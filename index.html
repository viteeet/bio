<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Victor Hugo — Desenvolvedor de Software &amp; Founder @ Codratec</title>
  <meta name="description" content="Cartão digital e contatos diretos de Victor Hugo. Automações de processos, dados, Agentes de IA e Sistemas Web sob medida.">
  <meta name="theme-color" content="#ffffff">

  <!-- FONTES: Inter e JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ELEMENTOS ILUMINADORES DE FUNDO (LUZ & GRADE SUBTIL) -->
  <div class="bg-light" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <!-- TOAST DE FEEDBACK DE AÇÕES -->
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true">
    <svg class="toast-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
    <span id="toast-text">Copiado com sucesso</span>
  </div>

  <div class="page-container">

    <main class="card">

      <!-- HEADER DE IDENTIDADE -->
      <header class="card-header">
        <div class="avatar-wrap">
          <div class="avatar" aria-label="Foto de perfil de Victor Hugo">VH</div>
          <span class="status-indicator" title="Disponível para novos projetos" aria-label="Status: Disponível para novos projetos"></span>
        </div>

        <div class="profile-info">
          <h1 class="name">Victor Hugo</h1>
          <p class="role">
            Desenvolvedor de Software • Founder <a href="https://codratec.com.br" target="_blank" rel="noopener noreferrer" class="brand-link">Codratec</a>
          </p>
          <p class="bio">
            Desenvolvimento de sistemas web, automações corporativas, engenharia de dados e Agentes de IA.
          </p>
        </div>
      </header>

      <!-- AÇÃO PRINCIPAL & LINKS DE CONTATO -->
      <section class="actions-section" aria-label="Canais de Contato">
        
        <!-- AÇÃO PRIMÁRIA: WHATSAPP -->
        <a 
          href="https://wa.me/5521983573881?text=Ol%C3%A1%20Victor,%20vi%20seu%20cart%C3%A3o%20de%20visita%20e%20gostaria%20de%20conversar." 
          target="_blank" 
          rel="noopener noreferrer" 
          class="btn btn-primary"
        >
          <svg class="btn-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          <span class="btn-label">Falar no WhatsApp</span>
        </a>

        <!-- AÇÃO SECUNDÁRIA: VCARD (.VCF) COM ESTADO DE LOADING -->
        <button id="vcard-btn" class="btn btn-secondary">
          <svg class="btn-svg default-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
          <svg class="btn-svg spinner-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
          <span class="btn-label">Salvar contato (.vcf)</span>
        </button>

        <!-- VER CURRÍCULO PROFISSIONAL -->
        <a 
          href="curriculo.html" 
          class="btn btn-tertiary"
        >
          <svg class="btn-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          <span class="btn-label">Ver Currículo / CV</span>
        </a>

        <!-- SITE INSTITUCIONAL -->
        <a 
          href="https://codratec.com.br" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="btn btn-tertiary"
        >
          <svg class="btn-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="2" x2="22" y1="12" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
          <span class="btn-label">codratec.com.br</span>
        </a>

        <!-- CÓPIA DE E-MAIL -->
        <button class="btn btn-tertiary copy-trigger" data-copy="victor@codratec.com.br">
          <svg class="btn-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
          <span class="btn-label">victor@codratec.com.br</span>
        </button>

      </section>

      <!-- PERFIS SOCIAIS -->
      <footer class="card-footer">
        <nav class="social-nav" aria-label="Redes Sociais">
          <a href="https://github.com/viteeet" target="_blank" rel="noopener noreferrer" aria-label="GitHub de Victor Hugo" class="social-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path><path d="M9 18c-4.51 2-5-2-7-2"></path></svg>
          </a>
          <a href="https://br.linkedin.com/in/victor-hugo-8785451b9" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn de Victor Hugo" class="social-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect width="4" height="12" x="2" y="9"></rect><circle cx="4" cy="4" r="2"></circle></svg>
          </a>
          <a href="https://www.instagram.com/codratec/" target="_blank" rel="noopener noreferrer" aria-label="Instagram da Codratec" class="social-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"></line></svg>
          </a>
        </nav>
        
        <div class="brand-tag">CODRATEC SOFTWARE HOUSE</div>
      </footer>

    </main>

  </div>

  <script src="script.js"></script>

</body>

</html>
