<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Victor Hugo | Desenvolvedor de Software</title>
  <meta name="description" content="Cartão digital e contatos diretos de Victor Hugo. Automações corporativas, engenharia de dados, Agentes de IA e Sistemas Web sob medida.">
  <meta name="theme-color" content="#090d16">

  <!-- FONTES: Inter e JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- BACKGROUND ANIMADO DARK (LUZES FLUTUANTES + GRADE PULSANTE) -->
  <div class="bg-animated" aria-hidden="true">
    <div class="bg-grid-overlay"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="glow-orb glow-orb-3"></div>
  </div>

  <!-- TOAST DE FEEDBACK -->
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true">
    <svg class="toast-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
    <span id="toast-text">victor@codratec.com.br copiado</span>
  </div>

  <!-- CARD CENTRALIZADO DARK (CAPRICHADO E ELEGANTE) -->
  <main class="bio-card">

    <!-- HEADER DO PERFIL -->
    <header class="bio-header">
      <div class="avatar-wrap">
        <div class="avatar">VH</div>
        <span class="status-dot" title="Disponível para novos projetos"></span>
      </div>

      <h1 class="bio-name">Victor Hugo</h1>
      <h2 class="bio-role">Desenvolvedor de Software</h2>
      <p class="bio-desc">
        Desenvolvimento de sistemas web, automações corporativas, engenharia de dados e Agentes de IA.
      </p>

      <!-- TAGS DE TECNOLOGIAS SUBTIS -->
      <div class="tech-pills">
        <span class="tech-pill">React</span>
        <span class="tech-pill">Next.js</span>
        <span class="tech-pill">Python</span>
        <span class="tech-pill">Node.js</span>
        <span class="tech-pill">SQL</span>
      </div>
    </header>

    <!-- BOTÕES EMPILHADOS LIMPOS -->
    <div class="bio-links">

      <!-- 1. WHATSAPP -->
      <a 
        href="https://wa.me/5521983573881?text=Ol%C3%A1%20Victor,%20vi%20seu%20cart%C3%A3o%20de%20visita%20e%20gostaria%20de%20conversar." 
        target="_blank" 
        rel="noopener noreferrer" 
        class="bio-btn btn-primary"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        <span>WhatsApp</span>
      </a>

      <!-- 2. PORTFÓLIO -->
      <a 
        href="https://codratec.com.br" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="bio-btn btn-outline"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" x2="22" y1="12" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        <span>Portfólio</span>
      </a>

      <!-- 3. CURRÍCULO -->
      <a 
        href="curriculo.html" 
        class="bio-btn btn-outline"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        <span>Currículo</span>
      </a>

      <!-- 4. E-MAIL -->
      <a 
        href="mailto:victor@codratec.com.br" 
        class="bio-btn btn-outline"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
        <span>E-mail</span>
      </a>

    </div>

    <!-- FOOTER -->
    <footer class="bio-footer">
      © Victor Hugo — Codratec
    </footer>

  </main>

  <script src="script.js"></script>

</body>

</html>
